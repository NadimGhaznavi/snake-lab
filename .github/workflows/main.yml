name: Rebuild GitHub Pages Site

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Requires Pages to use "Deploy from a branch" in repository settings.
      # Requests a rebuild of the configured source, not the dispatch branch.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
          echo "Build requested. Check the Pages deployment for the result." >> "$GITHUB_STEP_SUMMARY"
